name: Pinta o dia

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinta se faltar
        env:
          TZ: America/Sao_Paulo
        run: |
          set -eu
          TODAY=$(date +%F)
          if grep -q -- "$TODAY" diario.md; then
            echo "ja pintado $TODAY"
            exit 0
          fi
          printf '\n- %s — pintado automaticamente\n' "$TODAY" >> diario.md
          git config user.name "Matheus Scherer"
          git config user.email "contatomatheusscherer@gmail.com"
          git add diario.md
          git commit --author="Matheus Scherer <contatomatheusscherer@gmail.com>" -m "chore(diario): pinta ${TODAY}"
          git push
